<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The same mark as the header, with its colours written out: a favicon has
       no page to inherit them from, and it has to hold up against both a light
       and a dark tab bar, so it brings its own dark background. -->
  <rect width="32" height="32" rx="7" fill="#0d1117"/>
  <g stroke="#8fa8e8" stroke-width="1.5" fill="none"
     stroke-linecap="round" opacity="0.5">
    <path d="M16 16 L7.5 7.5 M16 16 L25 9 M16 16 L7 24.5 M16 16 L24.5 24.5
             M7.5 7.5 L25 9 M7 24.5 L24.5 24.5 M25 9 L24.5 24.5"/>
  </g>
  <g fill="#8fa8e8">
    <circle cx="7.5" cy="7.5" r="2.3"/>
    <circle cx="25" cy="9" r="2"/>
    <circle cx="7" cy="24.5" r="2"/>
    <circle cx="24.5" cy="24.5" r="2.3"/>
    <circle cx="16" cy="16" r="6.2"/>
  </g>
  <ellipse cx="16.9" cy="16" rx="1.85" ry="2.6" fill="#05070a"/>
</svg>
