<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The same mark as the header, with its colours written out: a favicon has
       no page to inherit them from, and it has to hold up against both a light
       and a dark tab bar, so it brings its own dark background. -->
  <rect width="32" height="32" rx="7" fill="#0d1117"/>
  <g stroke="#8fa8e8" stroke-width="1.4" fill="none"
     stroke-linecap="round" opacity="0.5">
    <path d="M16 16 L16 6.6 M16 16 L21.6 23.7 M16 16 L7.1 13.1
             M16 6.6 L24.9 13.1 M21.6 23.7 L10.4 23.7"/>
  </g>
  <g fill="#8fa8e8">
    <circle cx="16" cy="16" r="5"/>
    <circle cx="16" cy="6.6" r="3.3"/>
    <circle cx="24.9" cy="13.1" r="3.3"/>
    <circle cx="21.6" cy="23.7" r="3.3"/>
    <circle cx="10.4" cy="23.7" r="3.3"/>
    <circle cx="7.1" cy="13.1" r="3.3"/>
  </g>
  <g fill="#05070a">
    <ellipse cx="16.7" cy="16" rx="1.65" ry="2.2"/>
    <ellipse cx="16" cy="7.1" rx="1.15" ry="1.5"/>
    <ellipse cx="24.4" cy="13.2" rx="1.15" ry="1.5"/>
    <ellipse cx="21.2" cy="23.3" rx="1.15" ry="1.5"/>
    <ellipse cx="10.8" cy="23.3" rx="1.15" ry="1.5"/>
    <ellipse cx="7.6" cy="13.1" rx="1.15" ry="1.5"/>
  </g>
</svg>
