<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" role="img" aria-label="The coalition rule"><title>The coalition rule</title><style>
.dg-t{fill:#eef4fa;font:11.5px 'JetBrains Mono',ui-monospace,Menlo,Consolas,'DejaVu Sans Mono',monospace}
.dg-b{fill:#eef4fa;font:600 11.5px 'JetBrains Mono',ui-monospace,Menlo,Consolas,'DejaVu Sans Mono',monospace}
.dg-h{fill:#eef4fa;font:600 13.5px 'JetBrains Mono',ui-monospace,Menlo,Consolas,'DejaVu Sans Mono',monospace}
.dg-m{fill:#9ab0c3;font:10.5px 'JetBrains Mono',ui-monospace,Menlo,Consolas,'DejaVu Sans Mono',monospace}
.dg-s{fill:#9ab0c3;font:9.5px 'JetBrains Mono',ui-monospace,Menlo,Consolas,'DejaVu Sans Mono',monospace}
.dg-box{fill:#2d3d50;stroke:#5a6e86;stroke-width:1}
.dg-box2{fill:#384c64;stroke:#5a6e86;stroke-width:1}
.dg-frame{fill:none;stroke:#435468;stroke-width:1;stroke-dasharray:4 3}
.dg-line{stroke:#9ab0c3;stroke-width:1.4;fill:none}
.dg-faint{stroke:#7e94a5;stroke-width:1;fill:none;opacity:.6}
.dg-acc{stroke:#64bdff;stroke-width:2;fill:none}
.dg-warn{stroke:#ffd166;stroke-width:2;fill:none}
.dg-bad{stroke:#ff6b6b;stroke-width:2;fill:none}
.dg-good{stroke:#7ee787;stroke-width:2;fill:none}
.dg-node{fill:#64bdff}
.dg-node2{fill:#ffd166}
.dg-node3{fill:#7ee787}
.dg-node4{fill:#c792ea}
.dg-dead{fill:#ff6b6b}
.dg-grey{fill:#7e94a5}
.dg-fill{fill:#64bdff;opacity:.85}
.dg-fill2{fill:#ffd166;opacity:.85}
.dg-fill3{fill:#c792ea;opacity:.85}
</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9ab0c3"/></marker></defs><rect width="760" height="320" rx="10" fill="#18202b"/><text x="20.0" y="26.0" class="dg-h" text-anchor="start">The coalition rule: who wins a node</text><text x="40.0" y="62.0" class="dg-m" text-anchor="start">Revolutionary stakes, smallest first (R = 8):</text><rect x="40" y="70" width="50" height="34" class="dg-fill"/><text x="65.0" y="92.0" class="dg-b" text-anchor="middle">V: 1</text><rect x="90" y="70" width="150" height="34" class="dg-fill"/><text x="165.0" y="92.0" class="dg-b" text-anchor="middle">X: 3</text><rect x="240" y="70" width="200" height="34" class="dg-fill2"/><text x="340.0" y="92.0" class="dg-b" text-anchor="middle">W: 4</text><text x="40.0" y="142.0" class="dg-m" text-anchor="start">The hegemon's whole stake (H = 7):</text><rect x="40" y="150" width="350" height="34" class="dg-fill3"/><text x="215.0" y="172.0" class="dg-b" text-anchor="middle">U: 7</text><line x1="415.0" y1="50.0" x2="415.0" y2="205.0" class="dg-bad"/><text x="421.0" y="220.0" class="dg-m" text-anchor="start">(R + H) / 2 = 7.5</text><text x="40.0" y="255.0" class="dg-t" text-anchor="start">A coalition wins exactly when R &gt; H. The winner is the revolutionary in whose</text><text x="40.0" y="274.0" class="dg-t" text-anchor="start">stretch the line (R + H) / 2 falls — here W. Stakers with equal amounts form</text><text x="40.0" y="293.0" class="dg-t" text-anchor="start">one step, and the winner is drawn among them at random.</text></svg>
