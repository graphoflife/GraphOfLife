<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" width="760" height="640" role="img" aria-label="One node in the game, worked through"><title>One node in the game, worked through</title><style>
.dg-t{fill:#eef4fa;font:13px system-ui,sans-serif}
.dg-b{fill:#eef4fa;font:600 13px system-ui,sans-serif}
.dg-h{fill:#eef4fa;font:600 15px system-ui,sans-serif}
.dg-m{fill:#9ab0c3;font:12px system-ui,sans-serif}
.dg-s{fill:#9ab0c3;font:11px system-ui,sans-serif}
.dg-box{fill:#2d3d50;stroke:#5a6e86;stroke-width:1}
.dg-box2{fill:#384c64;stroke:#5a6e86;stroke-width:1}
.dg-frame{fill:none;stroke:#435468;stroke-width:1;stroke-dasharray:4 3}
.dg-line{stroke:#9ab0c3;stroke-width:1.4;fill:none}
.dg-faint{stroke:#7e94a5;stroke-width:1;fill:none;opacity:.6}
.dg-acc{stroke:#64bdff;stroke-width:2;fill:none}
.dg-warn{stroke:#ffd166;stroke-width:2;fill:none}
.dg-bad{stroke:#ff6b6b;stroke-width:2;fill:none}
.dg-good{stroke:#7ee787;stroke-width:2;fill:none}
.dg-node{fill:#64bdff}
.dg-node2{fill:#ffd166}
.dg-node3{fill:#7ee787}
.dg-node4{fill:#c792ea}
.dg-dead{fill:#ff6b6b}
.dg-grey{fill:#7e94a5}
.dg-fill{fill:#64bdff;opacity:.85}
.dg-fill2{fill:#ffd166;opacity:.85}
.dg-fill3{fill:#c792ea;opacity:.85}
</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9ab0c3"/></marker></defs><rect width="760" height="640" rx="10" fill="#18202b"/><text x="20.0" y="26.0" class="dg-h" text-anchor="start">One node in the game, worked through</text><line x1="380.0" y1="190.0" x2="190.0" y2="120.0" class="dg-line"/><line x1="380.0" y1="190.0" x2="560.0" y2="120.0" class="dg-line"/><line x1="380.0" y1="190.0" x2="380.0" y2="330.0" class="dg-line"/><line x1="560.0" y1="120.0" x2="380.0" y2="330.0" class="dg-faint"/><circle cx="190.0" cy="120.0" r="17" class="dg-node"/><text x="190.0" y="125.0" class="dg-b" text-anchor="middle">U</text><text x="20.0" y="92.0" class="dg-t" text-anchor="start">stakes 7 on V</text><text x="20.0" y="108.0" class="dg-m" text-anchor="start">none of it revolutionary</text><circle cx="560.0" cy="120.0" r="17" class="dg-node2"/><text x="560.0" y="125.0" class="dg-b" text-anchor="middle">W</text><text x="590.0" y="92.0" class="dg-t" text-anchor="start">stakes 4 on V</text><text x="590.0" y="108.0" class="dg-m" text-anchor="start">all 4 revolutionary</text><circle cx="380.0" cy="330.0" r="17" class="dg-node"/><text x="380.0" y="335.0" class="dg-b" text-anchor="middle">X</text><text x="410.0" y="302.0" class="dg-t" text-anchor="start">stakes 3 on V</text><text x="410.0" y="318.0" class="dg-m" text-anchor="start">all 3 revolutionary</text><circle cx="380.0" cy="190.0" r="17" class="dg-node"/><text x="380.0" y="195.0" class="dg-b" text-anchor="middle">V</text><text x="410.0" y="162.0" class="dg-t" text-anchor="start">stakes 2 on itself</text><text x="410.0" y="178.0" class="dg-m" text-anchor="start">1 of them revolutionary</text><text x="20.0" y="410.0" class="dg-t" text-anchor="start">Who takes node V?</text><text x="20.0" y="430.0" class="dg-t" text-anchor="start">The largest single stake is U's: H = 7. U is the hegemon.</text><text x="20.0" y="450.0" class="dg-t" text-anchor="start">The revolutionaries other than U: V (1), X (3), W (4).</text><text x="20.0" y="470.0" class="dg-t" text-anchor="start">Their revolutionary tokens add up to R = 1 + 3 + 4 = 8.</text><text x="20.0" y="490.0" class="dg-t" text-anchor="start">R &gt; H, so the coalition wins. Which of them? Add them up,</text><text x="20.0" y="510.0" class="dg-t" text-anchor="start">smallest first, until the sum passes (R + H) / 2 = 7.5:</text><text x="20.0" y="530.0" class="dg-t" text-anchor="start">   1 (V) → 4 (V, X) → 8 (V, X, W): W tips it. W wins V.</text><text x="20.0" y="550.0" class="dg-t" text-anchor="start"></text><text x="20.0" y="570.0" class="dg-t" text-anchor="start">V keeps its place and its connections, takes on a copy of</text><text x="20.0" y="590.0" class="dg-t" text-anchor="start">W's brain, and holds every token staked on it:</text><text x="20.0" y="610.0" class="dg-t" text-anchor="start">   7 + 4 + 3 + 2 = 16 tokens.</text></svg>
