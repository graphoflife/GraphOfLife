<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-label="Building a wheel of six spokes in four joins"><title>Building a wheel of six spokes in four joins</title><style>
.dg-t{fill:#eef4fa;font:11.5px 'JetBrains Mono',ui-monospace,Menlo,Consolas,'DejaVu Sans Mono',monospace}
.dg-b{fill:#eef4fa;font:600 11.5px 'JetBrains Mono',ui-monospace,Menlo,Consolas,'DejaVu Sans Mono',monospace}
.dg-h{fill:#eef4fa;font:600 13.5px 'JetBrains Mono',ui-monospace,Menlo,Consolas,'DejaVu Sans Mono',monospace}
.dg-m{fill:#9ab0c3;font:10.5px 'JetBrains Mono',ui-monospace,Menlo,Consolas,'DejaVu Sans Mono',monospace}
.dg-s{fill:#9ab0c3;font:9.5px 'JetBrains Mono',ui-monospace,Menlo,Consolas,'DejaVu Sans Mono',monospace}
.dg-box{fill:#2d3d50;stroke:#5a6e86;stroke-width:1}
.dg-box2{fill:#384c64;stroke:#5a6e86;stroke-width:1}
.dg-frame{fill:none;stroke:#435468;stroke-width:1;stroke-dasharray:4 3}
.dg-line{stroke:#9ab0c3;stroke-width:1.4;fill:none}
.dg-faint{stroke:#7e94a5;stroke-width:1;fill:none;opacity:.6}
.dg-acc{stroke:#64bdff;stroke-width:2;fill:none}
.dg-warn{stroke:#ffd166;stroke-width:2;fill:none}
.dg-bad{stroke:#ff6b6b;stroke-width:2;fill:none}
.dg-good{stroke:#7ee787;stroke-width:2;fill:none}
.dg-node{fill:#64bdff}
.dg-node2{fill:#ffd166}
.dg-node3{fill:#7ee787}
.dg-node4{fill:#c792ea}
.dg-dead{fill:#ff6b6b}
.dg-grey{fill:#7e94a5}
.dg-fill{fill:#64bdff;opacity:.85}
.dg-fill2{fill:#ffd166;opacity:.85}
.dg-fill3{fill:#c792ea;opacity:.85}
</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9ab0c3"/></marker></defs><rect width="760" height="330" rx="10" fill="#18202b"/><text x="20.0" y="26.0" class="dg-h" text-anchor="start">Building a wheel of six spokes in four joins</text><line x1="70.0" y1="126.0" x2="70.0" y2="92.0" class="dg-acc"/><circle cx="70.0" cy="126.0" r="4.2" class="dg-node"/><circle cx="70.0" cy="92.0" r="4.2" class="dg-grey"/><line x1="205.0" y1="126.0" x2="205.0" y2="92.0" class="dg-acc"/><line x1="205.0" y1="126.0" x2="205.0" y2="160.0" class="dg-acc"/><circle cx="205.0" cy="126.0" r="4.2" class="dg-node"/><circle cx="205.0" cy="92.0" r="4.2" class="dg-grey"/><circle cx="205.0" cy="160.0" r="4.2" class="dg-grey"/><line x1="345.0" y1="126.0" x2="345.0" y2="92.0" class="dg-acc"/><line x1="345.0" y1="92.0" x2="374.4" y2="109.0" class="dg-acc"/><line x1="345.0" y1="126.0" x2="345.0" y2="160.0" class="dg-acc"/><line x1="345.0" y1="160.0" x2="315.6" y2="143.0" class="dg-acc"/><circle cx="345.0" cy="126.0" r="4.2" class="dg-node"/><circle cx="345.0" cy="92.0" r="4.2" class="dg-grey"/><circle cx="374.4" cy="109.0" r="4.2" class="dg-grey"/><circle cx="345.0" cy="160.0" r="4.2" class="dg-grey"/><circle cx="315.6" cy="143.0" r="4.2" class="dg-grey"/><line x1="490.0" y1="126.0" x2="490.0" y2="92.0" class="dg-acc"/><line x1="490.0" y1="92.0" x2="519.4" y2="109.0" class="dg-acc"/><line x1="490.0" y1="126.0" x2="519.4" y2="143.0" class="dg-acc"/><line x1="519.4" y1="143.0" x2="490.0" y2="160.0" class="dg-acc"/><line x1="490.0" y1="126.0" x2="460.6" y2="143.0" class="dg-acc"/><line x1="460.6" y1="143.0" x2="460.6" y2="109.0" class="dg-acc"/><circle cx="490.0" cy="126.0" r="4.2" class="dg-node"/><circle cx="490.0" cy="92.0" r="4.2" class="dg-grey"/><circle cx="519.4" cy="109.0" r="4.2" class="dg-grey"/><circle cx="519.4" cy="143.0" r="4.2" class="dg-grey"/><circle cx="490.0" cy="160.0" r="4.2" class="dg-grey"/><circle cx="460.6" cy="143.0" r="4.2" class="dg-grey"/><circle cx="460.6" cy="109.0" r="4.2" class="dg-grey"/><line x1="650.0" y1="126.0" x2="650.0" y2="92.0" class="dg-acc"/><line x1="650.0" y1="92.0" x2="679.4" y2="109.0" class="dg-acc"/><line x1="650.0" y1="126.0" x2="679.4" y2="143.0" class="dg-acc"/><line x1="679.4" y1="143.0" x2="650.0" y2="160.0" class="dg-acc"/><line x1="650.0" y1="126.0" x2="620.6" y2="143.0" class="dg-acc"/><line x1="620.6" y1="143.0" x2="620.6" y2="109.0" class="dg-acc"/><line x1="650.0" y1="126.0" x2="679.4" y2="109.0" class="dg-warn"/><line x1="679.4" y1="109.0" x2="679.4" y2="143.0" class="dg-warn"/><line x1="650.0" y1="126.0" x2="650.0" y2="160.0" class="dg-warn"/><line x1="650.0" y1="160.0" x2="620.6" y2="143.0" class="dg-warn"/><line x1="650.0" y1="126.0" x2="620.6" y2="109.0" class="dg-warn"/><line x1="620.6" y1="109.0" x2="650.0" y2="92.0" class="dg-warn"/><circle cx="650.0" cy="126.0" r="4.2" class="dg-node"/><circle cx="650.0" cy="92.0" r="4.2" class="dg-grey"/><circle cx="679.4" cy="109.0" r="4.2" class="dg-grey"/><circle cx="679.4" cy="143.0" r="4.2" class="dg-grey"/><circle cx="650.0" cy="160.0" r="4.2" class="dg-grey"/><circle cx="620.6" cy="143.0" r="4.2" class="dg-grey"/><circle cx="620.6" cy="109.0" r="4.2" class="dg-grey"/><line x1="116.0" y1="126.0" x2="159.0" y2="126.0" class="dg-line" marker-end="url(#dg-arrow)"/><line x1="251.0" y1="126.0" x2="299.0" y2="126.0" class="dg-line" marker-end="url(#dg-arrow)"/><line x1="391.0" y1="126.0" x2="444.0" y2="126.0" class="dg-line" marker-end="url(#dg-arrow)"/><line x1="536.0" y1="126.0" x2="604.0" y2="126.0" class="dg-line" marker-end="url(#dg-arrow)"/><text x="70.0" y="60.0" class="dg-b" text-anchor="middle">a link</text><text x="70.0" y="76.0" class="dg-s" text-anchor="middle">the block</text><text x="70.0" y="186.0" class="dg-m" text-anchor="middle">1 link</text><text x="205.0" y="60.0" class="dg-b" text-anchor="middle">join 1</text><text x="205.0" y="76.0" class="dg-s" text-anchor="middle">link + link</text><text x="205.0" y="186.0" class="dg-m" text-anchor="middle">2 links</text><text x="345.0" y="60.0" class="dg-b" text-anchor="middle">join 2</text><text x="345.0" y="76.0" class="dg-s" text-anchor="middle">the path of 2, twice</text><text x="345.0" y="186.0" class="dg-m" text-anchor="middle">4 links</text><text x="490.0" y="60.0" class="dg-b" text-anchor="middle">join 3</text><text x="490.0" y="76.0" class="dg-s" text-anchor="middle">path of 4 + path of 2</text><text x="490.0" y="186.0" class="dg-m" text-anchor="middle">6 links</text><text x="650.0" y="60.0" class="dg-b" text-anchor="middle">join 4</text><text x="650.0" y="76.0" class="dg-s" text-anchor="middle">the spider, twice</text><text x="650.0" y="186.0" class="dg-m" text-anchor="middle">12 links</text><text x="20.0" y="228.0" class="dg-t" text-anchor="start">Each join lays two pieces already made together, making some of their nodes one node; whatever is</text><text x="20.0" y="246.0" class="dg-t" text-anchor="start">made can be used again for free. Join 2 uses the path of two links twice, and join 4 the spider of</text><text x="20.0" y="264.0" class="dg-t" text-anchor="start">three legs twice (yellow: the second copy, turned by one spoke). Twelve links take four joins, the</text><text x="20.0" y="282.0" class="dg-t" text-anchor="start">fewest any graph of twelve links can need: each join at most doubles the largest piece, and the</text><text x="20.0" y="300.0" class="dg-t" text-anchor="start">sizes made, 1, 2, 4, 6, 12, form a shortest addition chain, each a sum of two before it.</text></svg>
