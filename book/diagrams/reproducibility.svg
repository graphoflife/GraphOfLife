<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 425" width="760" height="425" role="img" aria-label="Experiment 1: four ways to run each seed"><title>Experiment 1: four ways to run each seed</title><style>
.dg-t{fill:#eef4fa;font:13px system-ui,sans-serif}
.dg-b{fill:#eef4fa;font:600 13px system-ui,sans-serif}
.dg-h{fill:#eef4fa;font:600 15px system-ui,sans-serif}
.dg-m{fill:#9ab0c3;font:12px system-ui,sans-serif}
.dg-s{fill:#9ab0c3;font:11px system-ui,sans-serif}
.dg-box{fill:#2d3d50;stroke:#5a6e86;stroke-width:1}
.dg-box2{fill:#384c64;stroke:#5a6e86;stroke-width:1}
.dg-frame{fill:none;stroke:#435468;stroke-width:1;stroke-dasharray:4 3}
.dg-line{stroke:#9ab0c3;stroke-width:1.4;fill:none}
.dg-faint{stroke:#7e94a5;stroke-width:1;fill:none;opacity:.6}
.dg-acc{stroke:#64bdff;stroke-width:2;fill:none}
.dg-warn{stroke:#ffd166;stroke-width:2;fill:none}
.dg-bad{stroke:#ff6b6b;stroke-width:2;fill:none}
.dg-good{stroke:#7ee787;stroke-width:2;fill:none}
.dg-node{fill:#64bdff}
.dg-node2{fill:#ffd166}
.dg-node3{fill:#7ee787}
.dg-node4{fill:#c792ea}
.dg-dead{fill:#ff6b6b}
.dg-grey{fill:#7e94a5}
.dg-fill{fill:#64bdff;opacity:.85}
.dg-fill2{fill:#ffd166;opacity:.85}
.dg-fill3{fill:#c792ea;opacity:.85}
</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9ab0c3"/></marker></defs><rect width="760" height="425" rx="10" fill="#18202b"/><text x="20.0" y="26.0" class="dg-h" text-anchor="start">Experiment 1: each seed run four ways, to iteration 30</text><text x="20.0" y="75.0" class="dg-b" text-anchor="start">straight</text><line x1="230.0" y1="70.0" x2="720.0" y2="70.0" class="dg-acc"/><text x="230.0" y="96.0" class="dg-s" text-anchor="start">one process, start to finish (the reference)</text><text x="20.0" y="145.0" class="dg-b" text-anchor="start">stopped at 10</text><line x1="230.0" y1="140.0" x2="393.3" y2="140.0" class="dg-acc"/><line x1="393.3" y1="140.0" x2="720.0" y2="140.0" class="dg-good"/><circle cx="393.3" cy="140.0" r="5" class="dg-node"/><text x="393.3" y="128.0" class="dg-s" text-anchor="middle">checkpoint · new process</text><text x="20.0" y="215.0" class="dg-b" text-anchor="start">cut off at 15</text><line x1="230.0" y1="210.0" x2="475.0" y2="210.0" class="dg-acc"/><line x1="393.3" y1="222.0" x2="720.0" y2="222.0" class="dg-good"/><circle cx="393.3" cy="210.0" r="5" class="dg-node"/><text x="393.3" y="198.0" class="dg-s" text-anchor="middle">last checkpoint</text><circle cx="475.0" cy="210.0" r="5" class="dg-dead"/><text x="475.0" y="198.0" class="dg-s" text-anchor="middle">killed</text><text x="20.0" y="285.0" class="dg-b" text-anchor="start">all BLAS threads</text><line x1="230.0" y1="280.0" x2="720.0" y2="280.0" class="dg-warn"/><text x="230.0" y="306.0" class="dg-s" text-anchor="start">the matrix library on every core</text><text x="230.0" y="350.0" class="dg-s" text-anchor="middle">0</text><text x="393.3" y="350.0" class="dg-s" text-anchor="middle">10</text><text x="475.0" y="350.0" class="dg-s" text-anchor="middle">15</text><text x="556.7" y="350.0" class="dg-s" text-anchor="middle">20</text><text x="720.0" y="350.0" class="dg-s" text-anchor="middle">30</text><text x="475.0" y="368.0" class="dg-m" text-anchor="middle">iteration</text><text x="20.0" y="396.0" class="dg-m" text-anchor="start">Every variant is compared with the straight run of its seed: every frame, every row of</text><text x="20.0" y="413.0" class="dg-m" text-anchor="start">statistics, and every array of the last checkpoint.</text></svg>
