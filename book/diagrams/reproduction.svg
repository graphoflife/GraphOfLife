<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 580" width="760" height="580" role="img" aria-label="A birth, worked through"><title>A birth, worked through</title><style>
.dg-t{fill:#eef4fa;font:13px system-ui,sans-serif}
.dg-b{fill:#eef4fa;font:600 13px system-ui,sans-serif}
.dg-h{fill:#eef4fa;font:600 15px system-ui,sans-serif}
.dg-m{fill:#9ab0c3;font:12px system-ui,sans-serif}
.dg-s{fill:#9ab0c3;font:11px system-ui,sans-serif}
.dg-box{fill:#2d3d50;stroke:#5a6e86;stroke-width:1}
.dg-box2{fill:#384c64;stroke:#5a6e86;stroke-width:1}
.dg-frame{fill:none;stroke:#435468;stroke-width:1;stroke-dasharray:4 3}
.dg-line{stroke:#9ab0c3;stroke-width:1.4;fill:none}
.dg-faint{stroke:#7e94a5;stroke-width:1;fill:none;opacity:.6}
.dg-acc{stroke:#64bdff;stroke-width:2;fill:none}
.dg-warn{stroke:#ffd166;stroke-width:2;fill:none}
.dg-bad{stroke:#ff6b6b;stroke-width:2;fill:none}
.dg-good{stroke:#7ee787;stroke-width:2;fill:none}
.dg-node{fill:#64bdff}
.dg-node2{fill:#ffd166}
.dg-node3{fill:#7ee787}
.dg-node4{fill:#c792ea}
.dg-dead{fill:#ff6b6b}
.dg-grey{fill:#7e94a5}
.dg-fill{fill:#64bdff;opacity:.85}
.dg-fill2{fill:#ffd166;opacity:.85}
.dg-fill3{fill:#c792ea;opacity:.85}
</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9ab0c3"/></marker></defs><rect width="760" height="580" rx="10" fill="#18202b"/><text x="20.0" y="26.0" class="dg-h" text-anchor="start">A birth, worked through</text><text x="150.0" y="58.0" class="dg-b" text-anchor="middle">Before</text><line x1="150.0" y1="170.0" x2="60.0" y2="90.0" class="dg-line"/><line x1="150.0" y1="170.0" x2="240.0" y2="90.0" class="dg-line"/><line x1="150.0" y1="170.0" x2="150.0" y2="290.0" class="dg-line"/><circle cx="150.0" cy="170.0" r="16" class="dg-node"/><text x="150.0" y="175.0" class="dg-b" text-anchor="middle">P</text><text x="172.0" y="158.0" class="dg-m" text-anchor="start">17</text><circle cx="60.0" cy="90.0" r="16" class="dg-node"/><text x="60.0" y="95.0" class="dg-b" text-anchor="middle">A</text><text x="82.0" y="78.0" class="dg-m" text-anchor="start">5</text><circle cx="240.0" cy="90.0" r="16" class="dg-node"/><text x="240.0" y="95.0" class="dg-b" text-anchor="middle">B</text><text x="262.0" y="78.0" class="dg-m" text-anchor="start">30</text><circle cx="150.0" cy="290.0" r="16" class="dg-node"/><text x="150.0" y="295.0" class="dg-b" text-anchor="middle">C</text><text x="172.0" y="278.0" class="dg-m" text-anchor="start">8</text><text x="300.0" y="74.0" class="dg-t" text-anchor="start">P holds 17 tokens. Its brain looks at P, A, B and C (4 columns).</text><text x="300.0" y="95.0" class="dg-t" text-anchor="start">Child's share: the two reproduction outputs, averaged over the</text><text x="300.0" y="116.0" class="dg-t" text-anchor="start">4 columns, are (0.8, 1.2): share = 0.8 / (0.8 + 1.2) = 0.4,</text><text x="300.0" y="137.0" class="dg-t" text-anchor="start">so the child gets ⌊0.4 · 17⌋ = ⌊6.8⌋ = 6 tokens; P keeps 11.</text><text x="300.0" y="158.0" class="dg-t" text-anchor="start">Links, one yes/no per column: P yes, A no, B yes, C no.</text><text x="300.0" y="179.0" class="dg-t" text-anchor="start">Handover, one yes/no per neighbour: A no, B no, C yes —</text><text x="300.0" y="200.0" class="dg-t" text-anchor="start">P's connection to C moves to the child.</text><text x="300.0" y="221.0" class="dg-t" text-anchor="start">The child's brain is a copy of P's, changed with probability 0.2.</text><text x="560.0" y="300.0" class="dg-b" text-anchor="middle">After</text><line x1="560.0" y1="400.0" x2="470.0" y2="330.0" class="dg-line"/><line x1="560.0" y1="400.0" x2="650.0" y2="330.0" class="dg-line"/><line x1="560.0" y1="400.0" x2="680.0" y2="470.0" class="dg-line"/><line x1="680.0" y1="470.0" x2="650.0" y2="330.0" class="dg-line"/><line x1="680.0" y1="470.0" x2="560.0" y2="520.0" class="dg-line"/><circle cx="560.0" cy="400.0" r="16" class="dg-node"/><text x="560.0" y="405.0" class="dg-b" text-anchor="middle">P</text><text x="582.0" y="388.0" class="dg-m" text-anchor="start">11</text><circle cx="470.0" cy="330.0" r="16" class="dg-node"/><text x="470.0" y="335.0" class="dg-b" text-anchor="middle">A</text><text x="492.0" y="318.0" class="dg-m" text-anchor="start">5</text><circle cx="650.0" cy="330.0" r="16" class="dg-node"/><text x="650.0" y="335.0" class="dg-b" text-anchor="middle">B</text><text x="672.0" y="318.0" class="dg-m" text-anchor="start">30</text><circle cx="560.0" cy="520.0" r="16" class="dg-node"/><text x="560.0" y="525.0" class="dg-b" text-anchor="middle">C</text><text x="582.0" y="508.0" class="dg-m" text-anchor="start">8</text><circle cx="680.0" cy="470.0" r="16" class="dg-node2"/><text x="680.0" y="475.0" class="dg-b" text-anchor="middle">c</text><text x="702.0" y="458.0" class="dg-m" text-anchor="start">6</text><text x="20.0" y="560.0" class="dg-m" text-anchor="start">Tokens before: 17 + 5 + 30 + 8 = 60. After: 11 + 6 + 5 + 30 + 8 = 60. A birth moves tokens; it never makes them.</text><text x="20.0" y="345.0" class="dg-m" text-anchor="start">The new connections P–c and c–B must carry</text><text x="20.0" y="362.0" class="dg-m" text-anchor="start">tokens in the coming game, or they are cut</text><text x="20.0" y="379.0" class="dg-m" text-anchor="start">at its end (as is every other connection).</text></svg>
