.dg-faint{stroke:#7e94a5;stroke-width:1;fill:none;opacity:.6}
.dg-acc{stroke:#64bdff;stroke-width:2;fill:none}
.dg-warn{stroke:#ffd166;stroke-width:2;fill:none}
.dg-bad{stroke:#ff6b6b;stroke-width:2;fill:none}
.dg-good{stroke:#7ee787;stroke-width:2;fill:none}
.dg-node{fill:#64bdff}
.dg-node2{fill:#ffd166}
.dg-node3{fill:#7ee787}
.dg-node4{fill:#c792ea}
.dg-dead{fill:#ff6b6b}
.dg-grey{fill:#7e94a5}
.dg-fill{fill:#64bdff;opacity:.85}
.dg-fill2{fill:#ffd166;opacity:.85}
.dg-fill3{fill:#c792ea;opacity:.85}
</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9ab0c3"/></marker></defs><rect width="760" height="620" rx="10" fill="#18202b"/><text x="20.0" y="26.0" class="dg-h" text-anchor="start">Patterns of takeovers, three games each</text><text x="20.0" y="60.0" class="dg-b" text-anchor="start">Puffer</text><text x="20.0" y="77.0" class="dg-m" text-anchor="start">moves on and keeps its home: a trail of copies</text><text x="20.0" y="122.0" class="dg-s" text-anchor="start">game 1</text><line x1="109.0" y1="118.0" x2="145.0" y2="118.0" class="dg-faint"/><line x1="167.0" y1="118.0" x2="203.0" y2="118.0" class="dg-faint"/><line x1="225.0" y1="118.0" x2="261.0" y2="118.0" class="dg-faint"/><line x1="283.0" y1="118.0" x2="319.0" y2="118.0" class="dg-faint"/><circle cx="98.0" cy="118.0" r="11" class="dg-node"/><circle cx="156.0" cy="118.0" r="11" class="dg-grey"/><circle cx="214.0" cy="118.0" r="11" class="dg-grey"/><circle cx="272.0" cy="118.0" r="11" class="dg-grey"/><circle cx="330.0" cy="118.0" r="11" class="dg-grey"/><rect x="92.0" y="96.0" width="12.0" height="8.0" rx="2" class="dg-box2"/><path d="M98.0,107.0 Q127.0,83.0 156.0,106.0" class="dg-acc" marker-end="url(#dg-arrow)"/><text x="20.0" y="172.0" class="dg-s" text-anchor="start">game 2</text><line x1="109.0" y1="168.0" x2="145.0" y2="168.0" class="dg-faint"/><line x1="167.0" y1="168.0" x2="203.0" y2="168.0" class="dg-faint"/><line x1="225.0" y1="168.0" x2="261.0" y2="168.0" class="dg-faint"/><line x1="283.0" y1="168.0" x2="319.0" y2="168.0" class="dg-faint"/><circle cx="98.0" cy="168.0" r="11" class="dg-node"/><circle cx="156.0" cy="168.0" r="11" class="dg-node"/><circle cx="214.0" cy="168.0" r="11" class="dg-grey"/><circle cx="272.0" cy="168.0" r="11" class="dg-grey"/><circle cx="330.0" cy="168.0" r="11" class="dg-grey"/><rect x="150.0" y="146.0" width="12.0" height="8.0" rx="2" class="dg-box2"/><path d="M