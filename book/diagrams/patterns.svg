lass="dg-node"/><circle cx="214.0" cy="348.0" r="11" class="dg-grey"/><circle cx="272.0" cy="348.0" r="11" class="dg-grey"/><circle cx="330.0" cy="348.0" r="11" class="dg-grey"/><rect x="150.0" y="326.0" width="12.0" height="8.0" rx="2" class="dg-box2"/><path d="M156.0,337.0 Q185.0,313.0 214.0,336.0" class="dg-acc" marker-end="url(#dg-arrow)"/><text x="20.0" y="402.0" class="dg-s" text-anchor="start">game 2</text><line x1="109.0" y1="398.0" x2="145.0" y2="398.0" class="dg-faint"/><line x1="167.0" y1="398.0" x2="203.0" y2="398.0" class="dg-faint"/><line x1="225.0" y1="398.0" x2="261.0" y2="398.0" class="dg-faint"/><line x1="283.0" y1="398.0" x2="319.0" y2="398.0" class="dg-faint"/><circle cx="98.0" cy="398.0" r="11" class="dg-grey"/><circle cx="156.0" cy="398.0" r="11" class="dg-node"/><circle cx="214.0" cy="398.0" r="11" class="dg-node"/><circle cx="272.0" cy="398.0" r="11" class="dg-grey"/><circle cx="330.0" cy="398.0" r="11" class="dg-grey"/><rect x="208.0" y="376.0" width="12.0" height="8.0" rx="2" class="dg-box2"/><path d="M214.0,387.0 Q185.0,363.0 156.0,386.0" class="dg-acc" marker-end="url(#dg-arrow)"/><text x="20.0" y="452.0" class="dg-s" text-anchor="start">game 3</text><line x1="109.0" y1="448.0" x2="145.0" y2="448.0" class="dg-faint"/><line x1="167.0" y1="448.0" x2="203.0" y2="448.0" class="dg-faint"/><line x1="225.0" y1="448.0" x2="261.0" y2="448.0" class="dg-faint"/><line x1="283.0" y1="448.0" x2="319.0" y2="448.0" class="dg-faint"/><circle cx="98.0" cy="448.0" r="11" class="dg-grey"/><circle cx="156.0" cy="448.0" r="11" class="dg-node"/><circle cx="214.0" cy="448.0" r="11" class="dg-node"/><circle cx="272.0" cy="448.0" r="11" class="dg-grey"/><circle cx="330.0" cy="448.0" r="11" class="dg-grey"/><rect x="150.0" y="426.0" width="12.0" height="8.0" rx="2" class="dg-box2"/><path d="M156.0,437.0 Q185.0,413.0 214.0,436.0" class="dg-acc" marker-end="url(#dg-arrow)"/><text x="400.0" y="290.0" class="dg-b" text-anchor="start">Gun</text><text x="400.0" y="307.0" class="dg-m" text-anchor="start">stays where it is and fires chain after chain</text><text x="400.0" y="352.0" class="dg-s" text-anchor="start">game 1</text><line x1="489.0" y1="348.0" x2="525.0" y2="348.0" class="dg-faint"/><line x1="547.0" y1="348.0" x2="583.0" y2="348.0" class="dg-faint"/><line x1="605.0" y1="348.0" x2="641.0" y2="348.0" class="dg-faint"/><line x1="663.0" y1="348.0" x2="699.0" y2="348.0" class="dg-faint"/><circle cx="478.0" cy="348.0" r="11" class="dg-grey"/><circle cx="536.0" cy="348.0" r="11" class="dg-grey"/><circle cx="594.0" cy="348.0" r="11" class="dg-node"/><circle cx="652.0" cy="348.0" r="11" class="dg-grey"/><circle cx="710.0" cy="348.0" r="11" class="dg-grey"/><rect x="588.0" y="326.0" width="12.0" height="8.0" rx="2" class="dg-box2"/><path d="M594.0,337.0 Q565.0,313.0 536.0,336.0" class="dg-acc" marker-end="url(#dg-arrow)"/><text x="400.0" y="402.0" class="dg-s" text-anchor="start">game 2</text><line x1="489.0" y1="398.0" x2="525.0" y2="398.0" class="dg-faint"/><line x1="547.0" y1="398.0" x2="583.0" y2="398.0" class="dg-faint"/><line x1="605.0" y1="398.0" x2="641.0" y2="398.0" class="dg-faint"/><line x1="663.0" y1="398.0" x2="699.0" y2="398.0" class="dg-faint"/><circle cx="478.0" cy="398.0" r="11" class="dg-grey"/><circle cx="536.0" cy="398.0" r="11" class="dg-node"/><circle cx="594.0" cy="398.0" r="11" class="dg-node"/><circle cx="652.0" cy="398.0" r="11" class="dg-grey"/><circle cx="710.0" cy="398.0" r="11" class="dg-grey"/><rect x="588.0" y="376.0" width="12.0" height="8.0" rx="2" class="dg-box2"/><path d="M594.0,387.0 Q623.0,363.0 652.0,386.0" class="dg-acc" marker-end="url(#dg-arrow)"/><text x="400.0" y="452.0" class="dg-s" text-anchor="start">game 3</text><line x1="489.0" y1="448.0" x2="525.0" y2="448.0" class="dg-faint"/><line x1="547.0" y1="448.0" x2="583.0" y2="448.0" class="dg-faint"/><line x1="605.0" y1="448.0" x2="641.0" y2="448.0" class="dg-faint"/><line x1="663.0" y1="448.0" x2="699.0" y2="448.0" class="dg-faint"/><circle cx="478.0" cy="448.0" r="11" class="dg-grey"/><circle cx="536.0" cy="448.0" r="11" class="dg-node"/><circle cx="594.0" cy="448.0" r="11" class="dg-node"/><circle cx="652.0" cy="448.0" r="11" class="dg-node"/><circle cx="710.0" cy="448.0" r="11" class="dg-grey"/><rect x="588.0" y="426.0" width="12.0" height="8.0" rx="2" class="dg-box2"/><path d="M594.0,437.0 Q565.0,413.0 536.0,436.0" class="dg-acc" marker-end="url(#dg-arrow)"/><circle cx="30.0" cy="520.0" r="7" class="dg-node"/><text x="44.0" y="524.0" class="dg-m" text-anchor="start">the lineage (copies of one brain)</text><circle cx="300.0" cy="520.0" r="7" class="dg-node2"/><text x="314.0" y="524.0" class="dg-m" text-anchor="start">another agent</text><circle cx="450.0" cy="520.0" r="7" class="dg-grey"/><text x="464.0" y="524.0" class="dg-m" text-anchor="start">others</text><rect x="540.0" y="516.0" width="12.0" height="8.0" rx="2" class="dg-box2"/><text x="560.0" y="524.0" class="dg-m" text-anchor="start">the packet of tokens</text><text x="20.0" y="556.0" class="dg-t" text-anchor="start">A row is one game: the arrow is a takeover with at least half of the taker's tokens, which</text><text x="20.0" y="574.0" class="dg-t" text-anchor="start">carries the packet and a copy of the brain to the node taken. A chain is a run of such moves,</text><text x="20.0" y="592.0" class="dg-t" text-anchor="start">each made from the node the last one took.</text></svg>
