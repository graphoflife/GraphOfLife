<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 340" width="980" height="340" role="img" aria-label="The brain of B1"><title>The brain of B1</title><style>
.dg-t{fill:#eef4fa;font:11.5px 'JetBrains Mono',ui-monospace,Menlo,Consolas,'DejaVu Sans Mono',monospace}
.dg-b{fill:#eef4fa;font:600 11.5px 'JetBrains Mono',ui-monospace,Menlo,Consolas,'DejaVu Sans Mono',monospace}
.dg-h{fill:#eef4fa;font:600 13.5px 'JetBrains Mono',ui-monospace,Menlo,Consolas,'DejaVu Sans Mono',monospace}
.dg-m{fill:#9ab0c3;font:10.5px 'JetBrains Mono',ui-monospace,Menlo,Consolas,'DejaVu Sans Mono',monospace}
.dg-s{fill:#9ab0c3;font:9.5px 'JetBrains Mono',ui-monospace,Menlo,Consolas,'DejaVu Sans Mono',monospace}
.dg-box{fill:#2d3d50;stroke:#5a6e86;stroke-width:1}
.dg-box2{fill:#384c64;stroke:#5a6e86;stroke-width:1}
.dg-frame{fill:none;stroke:#435468;stroke-width:1;stroke-dasharray:4 3}
.dg-line{stroke:#9ab0c3;stroke-width:1.4;fill:none}
.dg-faint{stroke:#7e94a5;stroke-width:1;fill:none;opacity:.6}
.dg-acc{stroke:#64bdff;stroke-width:2;fill:none}
.dg-warn{stroke:#ffd166;stroke-width:2;fill:none}
.dg-bad{stroke:#ff6b6b;stroke-width:2;fill:none}
.dg-good{stroke:#7ee787;stroke-width:2;fill:none}
.dg-node{fill:#64bdff}
.dg-node2{fill:#ffd166}
.dg-node3{fill:#7ee787}
.dg-node4{fill:#c792ea}
.dg-dead{fill:#ff6b6b}
.dg-grey{fill:#7e94a5}
.dg-fill{fill:#64bdff;opacity:.85}
.dg-fill2{fill:#ffd166;opacity:.85}
.dg-fill3{fill:#c792ea;opacity:.85}
</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9ab0c3"/></marker></defs><rect width="980" height="340" rx="10" fill="#18202b"/><text x="20.0" y="26.0" class="dg-h" text-anchor="start">The brain of B1, looking at one candidate</text><rect x="20.0" y="44.0" width="330.0" height="236.0" rx="6" class="dg-box"/><text x="32.0" y="64.0" class="dg-b" text-anchor="start">154 inputs</text><text x="34.0" y="90.0" class="dg-b" text-anchor="start">1</text><text x="70.0" y="90.0" class="dg-m" text-anchor="start">is the candidate the agent itself? (1 or 0)</text><text x="34.0" y="111.0" class="dg-b" text-anchor="start">4</text><text x="70.0" y="111.0" class="dg-m" text-anchor="start">log(1 + tokens) and log(1 + degree),</text><text x="34.0" y="132.0" class="dg-b" text-anchor="start"></text><text x="70.0" y="132.0" class="dg-m" text-anchor="start">   of the agent and of the candidate</text><text x="34.0" y="153.0" class="dg-b" text-anchor="start">24</text><text x="70.0" y="153.0" class="dg-m" text-anchor="start">6 quantiles of log tokens and of log degree</text><text x="34.0" y="174.0" class="dg-b" text-anchor="start"></text><text x="70.0" y="174.0" class="dg-m" text-anchor="start">   over the two neighbourhoods</text><text x="34.0" y="195.0" class="dg-b" text-anchor="start">120</text><text x="70.0" y="195.0" class="dg-m" text-anchor="start">4 messages of 30 numbers: agent→agent,</text><text x="34.0" y="216.0" class="dg-b" text-anchor="start"></text><text x="70.0" y="216.0" class="dg-m" text-anchor="start">   agent→candidate, candidate→agent,</text><text x="34.0" y="237.0" class="dg-b" text-anchor="start"></text><text x="70.0" y="237.0" class="dg-m" text-anchor="start">   candidate→candidate</text><text x="34.0" y="258.0" class="dg-b" text-anchor="start">5</text><text x="70.0" y="258.0" class="dg-m" text-anchor="start">random numbers, uniform between −2 and 2</text><rect x="384.0" y="87.0" width="30.0" height="150.0" rx="4" class="dg-box2"/><text x="399.0" y="253.0" class="dg-m" text-anchor="middle">50</text><rect x="430.0" y="94.5" width="30.0" height="135.0" rx="4" class="dg-box2"/><text x="445.0" y="245.5" class="dg-m" text-anchor="middle">45</text><line x1="414.0" y1="162.0" x2="428.0" y2="162.0" class="dg-line" marker-end="url(#dg-arrow)"/><rect x="476.0" y="102.0" width="30.0" height="120.0" rx="4" class="dg-box2"/><text x="491.0" y="238.0" class="dg-m" text-anchor="middle">40</text><line x1="460.0" y1="162.0" x2="474.0" y2="162.0" class="dg-line" marker-end="url(#dg-arrow)"/><rect x="522.0" y="109.5" width="30.0" height="105.0" rx="4" class="dg-box2"/><text x="537.0" y="230.5" class="dg-m" text-anchor="middle">35</text><line x1="506.0" y1="162.0" x2="520.0" y2="162.0" class="dg-line" marker-end="url(#dg-arrow)"/><rect x="568.0" y="117.0" width="30.0" height="90.0" rx="4" class="dg-box2"/><text x="583.0" y="223.0" class="dg-m" text-anchor="middle">30</text><line x1="552.0" y1="162.0" x2="566.0" y2="162.0" class="dg-line" marker-end="url(#dg-arrow)"/><line x1="352.0" y1="162.0" x2="382.0" y2="162.0" class="dg-line" marker-end="url(#dg-arrow)"/><text x="475.0" y="270.0" class="dg-m" text-anchor="middle">5 hidden layers, sigmoid</text><line x1="600.0" y1="162.0" x2="620.0" y2="162.0" class="dg-line" marker-end="url(#dg-arrow)"/><rect x="624.0" y="44.0" width="346.0" height="236.0" rx="6" class="dg-box"/><text x="636.0" y="64.0" class="dg-b" text-anchor="start">45 outputs (linear)</text><text x="638.0" y="90.0" class="dg-b" text-anchor="start">2</text><text x="668.0" y="90.0" class="dg-m" text-anchor="start">the child's share of the agent's tokens</text><text x="638.0" y="111.0" class="dg-b" text-anchor="start">2</text><text x="668.0" y="111.0" class="dg-m" text-anchor="start">join the child to this candidate? (yes, no)</text><text x="638.0" y="132.0" class="dg-b" text-anchor="start">2</text><text x="668.0" y="132.0" class="dg-m" text-anchor="start">… read as a probability, or take the larger?</text><text x="638.0" y="153.0" class="dg-b" text-anchor="start">1</text><text x="668.0" y="153.0" class="dg-m" text-anchor="start">stake score for this candidate</text><text x="638.0" y="174.0" class="dg-b" text-anchor="start">2</text><text x="668.0" y="174.0" class="dg-m" text-anchor="start">spread the stake by score, or all on the best?</text><text x="638.0" y="195.0" class="dg-b" text-anchor="start">2</text><text x="668.0" y="195.0" class="dg-m" text-anchor="start">revolutionary share of this stake</text><text x="638.0" y="216.0" class="dg-b" text-anchor="start">2</text><text x="668.0" y="216.0" class="dg-m" text-anchor="start">hand this connection to the child? (yes, no)</text><text x="638.0" y="237.0" class="dg-b" text-anchor="start">2</text><text x="668.0" y="237.0" class="dg-m" text-anchor="start">… read as a probability, or take the larger?</text><text x="638.0" y="258.0" class="dg-b" text-anchor="start">30</text><text x="668.0" y="258.0" class="dg-m" text-anchor="start">the message to this candidate (through tanh)</text><text x="20.0" y="308.0" class="dg-m" text-anchor="start">The same network reads every candidate — the agent itself and each neighbour — as one column of</text><text x="20.0" y="326.0" class="dg-m" text-anchor="start">154 numbers, and gives one column of 45 outputs per candidate. 15,795 weights and biases in all.</text></svg>
