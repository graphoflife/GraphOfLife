="7" class="dg-grey"/><circle cx="312.0" cy="196.0" r="7" class="dg-node"/><circle cx="312.0" cy="230.0" r="7" class="dg-grey"/><circle cx="312.0" cy="264.0" r="7" class="dg-grey"/><circle cx="312.0" cy="298.0" r="7" class="dg-grey"/><circle cx="312.0" cy="332.0" r="7" class="dg-grey"/><text x="176.0" dy="4" y="196.0" class="dg-b" text-anchor="middle">x</text><text x="380.0" y="74.0" class="dg-t" text-anchor="start">Every dot is an agent, every line a connection;</text><text x="380.0" y="93.0" class="dg-t" text-anchor="start">on a grid, the steps between two agents are</text><text x="380.0" y="112.0" class="dg-t" text-anchor="start">the steps along the lines.</text><text x="380.0" y="131.0" class="dg-t" text-anchor="start"></text><text x="380.0" y="150.0" class="dg-t" text-anchor="start">1. x's tokens and connections are measured at</text><text x="380.0" y="169.0" class="dg-t" text-anchor="start">   the start of the phase.</text><text x="380.0" y="188.0" class="dg-t" text-anchor="start">2. Agents up to 2 steps away see them: a brain</text><text x="380.0" y="207.0" class="dg-t" text-anchor="start">   reads a summary of each neighbour's neighbours.</text><text x="380.0" y="226.0" class="dg-t" text-anchor="start">3. Their neighbours read the messages they wrote</text><text x="380.0" y="245.0" class="dg-t" text-anchor="start">   before anyone acts: 3 steps.</text><text x="380.0" y="264.0" class="dg-t" text-anchor="start">4. Those neighbours stake on their own neighbours:</text><text x="380.0" y="283.0" class="dg-t" text-anchor="start">   4 steps. Blue: as far as news of x can travel.</text><text x="380.0" y="302.0" class="dg-t" text-anchor="start"></text><text x="380.0" y="321.0" class="dg-t" text-anchor="start">Green: x's own tokens, and a copy of its brain,</text><text x="380.0" y="340.0" class="dg-t" text-anchor="start">move at most one step in a game.</text><text x="380.0" y="359.0" class="dg-t" text-anchor="start">Grey: out of reach — unless the cull, the share-out</text><text x="380.0" y="378.0" class="dg-t" text-anchor="start">or the one random stream carry it there at once.</text></svg>
