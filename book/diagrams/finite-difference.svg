.dg-b{fill:#eef4fa;font:600 11.5px 'JetBrains Mono',ui-monospace,Menlo,Consolas,'DejaVu Sans Mono',monospace}
.dg-h{fill:#eef4fa;font:600 13.5px 'JetBrains Mono',ui-monospace,Menlo,Consolas,'DejaVu Sans Mono',monospace}
.dg-m{fill:#9ab0c3;font:10.5px 'JetBrains Mono',ui-monospace,Menlo,Consolas,'DejaVu Sans Mono',monospace}
.dg-s{fill:#9ab0c3;font:9.5px 'JetBrains Mono',ui-monospace,Menlo,Consolas,'DejaVu Sans Mono',monospace}
.dg-box{fill:#2d3d50;stroke:#5a6e86;stroke-width:1}
.dg-box2{fill:#384c64;stroke:#5a6e86;stroke-width:1}
.dg-frame{fill:none;stroke:#435468;stroke-width:1;stroke-dasharray:4 3}
.dg-line{stroke:#9ab0c3;stroke-width:1.4;fill:none}
.dg-faint{stroke:#7e94a5;stroke-width:1;fill:none;opacity:.6}
.dg-acc{stroke:#64bdff;stroke-width:2;fill:none}
.dg-warn{stroke:#ffd166;stroke-width:2;fill:none}
.dg-bad{stroke:#ff6b6b;stroke-width:2;fill:none}
.dg-good{stroke:#7ee787;stroke-width:2;fill:none}
.dg-node{fill:#64bdff}
.dg-node2{fill:#ffd166}
.dg-node3{fill:#7ee787}
.dg-node4{fill:#c792ea}
.dg-dead{fill:#ff6b6b}
.dg-grey{fill:#7e94a5}
.dg-fill{fill:#64bdff;opacity:.85}
.dg-fill2{fill:#ffd166;opacity:.85}
.dg-fill3{fill:#c792ea;opacity:.85}
</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9ab0c3"/></marker></defs><rect width="760" height="470" rx="10" fill="#18202b"/><text x="20.0" y="26.0" class="dg-h" text-anchor="start">The even split is a step of the heat equation</text><text x="30.0" y="100.0" class="dg-t" text-anchor="start">before</text><rect x="220.0" y="70.0" width="70.0" height="46.0" rx="6" class="dg-box"/><text x="255.0" y="99.0" class="dg-b" text-anchor="middle">0</text><rect x="304.0" y="70.0" width="70.0" height="46.0" rx="6" class="dg-box"/><text x="339.0" y="99.0" class="dg-b" text-anchor="middle">0</text><rect x="388.0" y="70.0" width="70.0" height="46.0" rx="6" class="dg-box2"/><text x="423.0" y="99.0" class="dg-b" text-anchor="middle">9</text><rect x="472.0" y="70.0" width="70.0" height="46.0" rx="6" class="dg-box"/><text x="507.0" y="99.0" class="dg-b" text-anchor="middle">0</text><rect x="556.0" y="70.0" width="70.0" height="46.0" rx="6" class="dg-box"/><text x="591.0" y="99.0" class="dg-b" text-anchor="middle">0</text><line x1="255.0" y1="120.0" x2="255.0" y2="156.0" class="dg-faint" marker-end="url(#dg-arrow)"/><line x1="255.0" y1="120.0" x2="331.0" y2="156.0" class="dg-faint" marker-end="url(#dg-arrow)"/><line x1="339.0" y1="120.0" x2="339.0" y2="156.0" class="dg-faint" marker-end="url(#dg-arrow)"/><line x1="339.0" y1="120.0" x2="263.0" y2="156.0" class="dg-faint" marker-end="url(#dg-arrow)"/><line x1="339.0" y1="120.0" x2="415.0" y2="156.0" class="dg-faint" marker-end="url(#dg-arrow)"/><line x1="423.0" y1="120.0" x2="423.0" y2="156.0" class="dg-faint" marker-end="url(#dg-arrow)"/><line x1="423.0" y1="120.0" x2="347.0" y2="156.0" class="dg-faint" marker-end="url(#dg-arrow)"/><line x1="423.0" y1="120.0" x2="499.0" y2="156.0" class="dg-faint" marker-end="url(#dg-arrow)"/><line x1="507.0" y1="120.0" x2="507.0" y2="156.0" class="dg-faint" marker-end="url(#dg-arrow)"/><line x1="507.0" y1="120.0" x2="431.0" y2="156.0" class="dg-faint" marker-end="url(#dg-arrow)"/><line x1="507.0" y1="120.0" x2="583.0" y2="156.0" class="dg-faint" marker-end="url(#dg-arrow)"/><line x1="591.0" y1="120.0" x2="591.0" y2="156.0" class="dg-faint" marker-end="url(#dg-arrow)"/><line x1="591.0" y1="120.0" x2="515.0" y2="156.0" class="dg-faint" marker-end="url(#dg-arrow)"/><text x="30.0" y="192.0" class="dg-t" text-anchor="start">after one game</text><rect x="220.0" y="162.0" width="70.0" height="46.0" rx="6" class="dg-box"/><text x="255.0" y="191.0" class="dg-b" text-anchor="middle">0</text><rect x="304.0" y="162.0" width="70.0" height="46.0" rx="6" class="dg-box2"/><text x="339.0" y="191.0" class="dg-b" text-anchor="middle">3</text><rect x="388.0" y="162.0" width="70.0" height="46.0" rx="6" class="dg-box2"/><text x="423.0" y="191.0" class="dg-b" text-anchor="middle">3</text><rect x="472.0" y="162.0" width="70.0" height="46.0" rx="6" class="dg-box2"/><text x="507.0" y="191.0" class="dg-b" text-anchor="middle">3</text><rect x="556.0" y="162.0" width="70.0" height="46.0" rx="6" class="dg-box"/><text x="591.0" y="191.0" class="dg-b" text-anchor="middle">0</text><line x1="255.0" y1="212.0" x2="255.0" y2="248.0" class="dg-faint" marker-end="url(#dg-arrow)"/><line x1="255.0" y1="212.0" x2="331.0" y2="248.0" class="dg-faint" marker-end="url(#dg-arrow)"/><line x1="339.0" y1="212.0" x2="339.0" y2="248.0" class="dg-faint" marker-end="url(#dg-arrow)"/><line x1="339.0" y1="212.0" x2="263.0" y2="248.0" class="dg-faint" marker-end="url(#dg-arrow)"/><line x1="339.0" y1="212.0" x2="415.0" y2="248.0" class="dg-faint" marker-end="url(#dg-arrow)"/><line x1="423.0" y1="212.0" x2="423.0" y2="248.0" class="dg-faint" marker-end="url(#dg-arrow)"/><line x1="423.0" y1="212.0" x2="347.0" y2="248.0" class="dg-faint" marker-end="url(#dg-arrow)"/><line x1="423.0" y1="212.0" x2="499.0" y2="248.0" class="dg-faint" marker-end="url(#dg-arrow)"/><line x1="507.0" y1="212.0" x2="507.0" y2="248.0" class="dg-faint" marker-end="url(#dg-arrow)"/><line x1="507.0" y1="212.0" x2="431.0" y2="248.0" class="dg-faint" marker-end="url(#dg-arrow)"/><line x1="507.0" y1="212.0" x2="583.0" y2="248.0" class="dg-faint" marker-end="url(#dg-arrow)"/><line x1="591.0" y1="212.0" x2="591.0" y2="248.0" class="dg-faint" marker-end="url(#dg-arrow)"/><line x1="591.0" y1="212.0" x2="515.0" y2="248.0" class="dg-faint" marker-end="url(#dg-arrow)"/><text x="30.0" y="284.0" class="dg-t" text-anchor="start">after two games</text><rect x="220.0" y="254.0" width="70.0" height="46.0" rx="6" class="dg-box2"/><text x="255.0" y="283.0" class="dg-b" text-anchor="middle">1</text><rect x="304.0" y="254.0" width="70.0" height="46.0" rx="6" class="dg-box2"/><text x="339.0" y="283.0" class="dg-b" text-anchor="middle">2</text><rect x="388.0" y="254.0" width="70.0" height="46.0" rx="6" class="dg-box2"/><text x="423.0" y="283.0" class="dg-b" text-anchor="middle">3</text><rect x="472.0" y="254.0" width="70.0" height="46.0" rx="6" class="dg-box2"/><text x="507.0" y="283.0" class="dg-b" text-anchor="middle">2</text><rect x="556.0" y="254.0" width="70.0" height="46.0" rx="6" class="dg-box2"/><text x="591.0" y="283.0" class="dg-b" text-anchor="middle">1</text><text x="30.0" y="352.0" class="dg-t" text-anchor="start">Five agents of a long line (those beyond hold nothing), each joined to its two neighbours. In a</text><text x="30.0" y="371.0" class="dg-t" text-anchor="start">game each splits its tokens evenly over itself and its neighbours: a third each. A node then</text><text x="30.0" y="390.0" class="dg-t" text-anchor="start">holds the thirds staked on it, so every agent ends with the average of itself and its neighbours:</text><text x="30.0" y="409.0" class="dg-t" text-anchor="start">    τ'(i) = (τ(i−1) + τ(i) + τ(i+1)) / 3  =  τ(i) + (τ(i−1) − 2τ(i) + τ(i+1)) / 3.</text><text x="30.0" y="428.0" class="dg-t" text-anchor="start">The bracket is the discrete Laplacian — the token curvature. This is exactly how a computer</text><text x="30.0" y="447.0" class="dg-t" text-anchor="start">solves the heat equation ∂u/∂t = D ∂²u/∂x² on a grid, one small step at a time.</text></svg>
