name: Publish the site

# The site is web/ with the Python engine copied in beside it. build_site.sh
# does that assembly, and it is the same script used to check the site locally
# before pushing, so what is served here cannot drift from what was tested.

on:
  push:
    branches: [main]
  # Checks run on the change, not on the consequence. Without this the first
  # time anything is verified is after it is already on main and on its way to
  # being published; the deploy is still gated, but by then the only options
  # are revert or fix forward.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # deploy-pages reads the artifact back from the run that built it, and has
  # required this since v4. Naming a permissions block at all sets everything
  # unlisted to none, so it has to be granted explicitly.
  actions: read

# One deployment at a time. Queued rather than cancelled, so a push during a
# deploy still ends up published rather than silently skipped.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Nothing is published before the invariants pass. A site that deploys while
  # the engine is broken is worse than one that fails to deploy.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install what the engine needs
        run: pip install --quiet -r requirements.txt
      - name: Engine invariants
        run: python3 tests/test_engine.py
      - name: The lab runs what the book plans, and stopping it changes nothing
        run: python3 tests/test_lab.py
      - name: A run's statistics, and the page's registry of them
        run: python3 tests/test_series.py
      - name: The server and the static site ship and answer alike
        run: python3 tests/test_site.py
      - name: The book keeps what it measures, and draws only what it can
        run: python3 tests/test_book.py
      - name: The teaching script decides as the engine does, and keeps its tokens
        run: python3 tests/test_explain_minimal.py
      - name: The page's tests, every file of them
        run: node tests/run.js
      - name: Every script parses
        run: |
          for f in web/js/*.js; do node --check "$f"; done
          python3 -m compileall -q *.py web/py/*.py

  build:
    needs: test
    # A pull request gets the tests and the assembly; only main is published.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Assemble the site
        run: |
          chmod +x build_site.sh
          ./build_site.sh

      # What the browser runs is the worker's PY_FILES, and the Explanation
      # fetches the teaching script. The list is read from the worker: written
      # out here, it kept a file the browser had stopped needing and failed
      # every deploy after.
      - name: Check the engine actually made it
        run: |
          wanted=$(sed -n "/const PY_FILES = \[/,/\];/p" web/js/sim-worker.js \
                   | grep -o "'[^']*\.py'" | tr -d "'")
          test -n "$wanted" || { echo "could not read PY_FILES from sim-worker.js"; exit 1; }
          for f in $(printf 'py/%s ' $wanted) py/explain_minimal.py js/sim-worker.js index.html; do
            test -s "_site/$f" || { echo "missing or empty: $f"; exit 1; }
          done
          echo "site contains $(find _site -type f | wc -l) files"

      # The stamping is what stops a returning visitor running new code against
      # an old worker or an old recording. tests/test_site.py checks nothing
      # escapes the list; this checks the list was actually applied.
      - name: Every asset carries the commit it came from
        run: |
          bare=$(grep -rn "importScripts('[^?]*')\|new Worker('[^?]*')" _site/js/*.js \
                 | grep -v "PYODIDE" || true)
          if [ -n "$bare" ]; then echo "unstamped:"; echo "$bare"; exit 1; fi
          grep -q 'js/app\.js?v=' _site/index.html || { echo "index.html unstamped"; exit 1; }
          echo "assets stamped"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
